<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img">
  <title>Magic Resume 微信小程序版</title>
  <desc>苹果设计风格的微信小程序简历工具，本地离线智能分析，支持接入自有大模型。</desc>

  <rect width="1200" height="340" rx="24" fill="#F2F2F7"/>
